- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: University of California, Santa Cruz
      year: 2025 - Present
      description:
        - Optimal control of chaotic systems using differentiable neural emulators. Developing gradient-based optimization pipelines in PyTorch and JAX on top of ML weather emulators (LUCIE, NeuralGCM, ACE2-ERA5), with Backpropagation-Through-Time and gradient checkpointing for long-horizon optimization on HPC.
        - ML data infrastructure and emulator training for climate applications. Built end-to-end pipelines for ERA5 reanalysis data; trained and fine-tuned an SFNO-based neural weather model, extending its variable set and validating checkpoint quality against held-out fields.

    - title: Doctoral Researcher
      institution: University of New Hampshire, Durham, NH
      year: 2020 - 2025
      description:
        - Reduced-order modeling of turbulent flows. Developed scalable Python spectral simulation frameworks for high-dimensional turbulent flow data; leveraged asymptotic analysis to achieve a 10× performance improvement. Presented at APS-DFD 2024; manuscript in preparation for the Journal of Fluid Mechanics.
        - Accelerating numerical solvers with neural networks. Designed a C++/CUDA framework that interleaves a high-fidelity CFD solver with a PyTorch neural operator — capping the network horizon at the chaos limit to halve wall-clock time while preserving accuracy and keeping the pipeline differentiable. Presented at SC24.
        - Teaching assistant for undergraduate engineering courses. Delivered lectures, mentored students, and built an automated grading system that streamlined faculty workload. Recognized with competitive summer fellowships for outstanding TAs.

    - title: Intern, Airbus Chair for Mathematics of Complex Systems
      institution: TIFR - Center for Applicable Mathematics, Bangalore, India
      year: 2016
      description:
        - Developed a finite-volume PDE solver in C for the compressible Navier-Stokes equations, with a Git-based workflow for version control and collaboration.

    - title: Graduate Engineer Trainee
      institution: Tata Motors, Pune, India
      year: 2015 - 2016
      description:
        - FEM-based thermal and structural studies of IC engine crankshaft deflections under extreme loads in ANSYS and CATIA. Earned Siemens PLM certification.

